# 跨书结论
conclusion:
  章级: |
    四本书在**章级都是 1:1**（19~38 章，无缺无多）。所以章级对齐不是难点，
    难点是①噪音清理 ②无编号条目的配对 ③小节级。
  小节级_按书的信号分流:
    prob: |
      **两版都有小节编号** → 确定性编号匹配 = 正确率上限：
      284/307 直接命中（92.5%），另 6 条「ZH 编号丢失」靠位置可唯一推定，
      余 17 条判「EN 独有」。**合计 307/307 = 100%，不需要 LLM。**
    ml: |
      两侧小节**都无编号**，且中文目录只到章级 → 小节必须靠**标题语义**配，
      LLM 是唯一出路。
    think2: |
      两侧小节**都无编号**（目录里没有小节）→ 同 ml，靠语义。
    nexus: |
      章有编号（第N章/Chapter N）、小节无编号 → 章靠编号、小节靠语义。
