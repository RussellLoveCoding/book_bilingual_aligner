nexus:
  book: {en: "Nexus", zh: "智人之上：从石器时代到AI时代的信息网络简史"}
  chapter_gold: 14
  warning: |
    ⚠ 工作区里的「英文侧」是**我们自己 emit 出来的**单语版，它的 nav 标题
      已经中文化（封面 / 扉页）。**原始书店版不在工作区**（用户提到的
      `OEBPS/9780593734247_nav.xhtml`），所以这本数据仅供参考。
  structure:
    en: [封面, 扉页, Prologue, Chapter 1 … Chapter 11, Epilogue, Acknowledgments]
    zh: [封面, 扉页, 序言, 第一章 … 第十一章, 结语, 致谢]
  pairs_verified:
    chapter: "11 章按编号 1:1（EN `Chapter N` ↔ ZH `第N章`，中文用汉字数字）"
    others: "Prologue↔序言 · Epilogue↔结语 · Acknowledgments↔致谢"
  noise: |
    两侧都把「章内小标题」混在同一层级里（EN: The Biological Dramas /
    Print, Science, and Witches / Mass Media… / Total Control / What Are the
    Implications? / The Calculus of Suffering / The Right to an Explanation /
    The Global Bond；ZH 只有 4 条），且**两侧数量不等** →
    纯位置对齐必然漂移（实测 Recall 42.9%）。
  section_level: "目录里没有系统的小节；正文里两侧各 157/160 条候选"

