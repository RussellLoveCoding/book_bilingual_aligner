# 金标准目录：思考快与慢 / 机器学习实战 / 智人之上
# 作者：助理逐条核对（2026-09-15），**不是**算法输出
# 数据源：两侧 = 各自 epub 的出版方目录（nav/ncx，权威）
#
# ⚠ 这三本的**小节没有编号**（目录只列标题，如 "What Is Machine Learning?"），
#   所以「小节的正确配对」无法从目录建立金标准，必须读正文人工建 —— 见文末。

