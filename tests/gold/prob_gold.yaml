# 金标准目录（gold TOC）：概率论沉思录
# 作者：助理逐条推理核对（2026-09-15），**不是**算法输出
# 数据来源：EN 侧 = prob_en.epub 出版方目录（nav/ncx，权威）；
#           ZH 侧 = prob_zh.md 的 # 标题 + 我的逐章判定
#
# 用途：作为评价「标题/小节配对算法」的参照物。
# 结论摘要见文件末尾「核对结果」。

book:
  en: "Probability Theory: The Logic of Science"
  zh: "概率论沉思录"

# ── 顶层结构 ────────────────────────────────────────────────
structure:
  en:
